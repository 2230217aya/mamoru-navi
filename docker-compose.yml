version: "3.8"

services:
  # 1. バックエンドサービス
  backend:
    build:
      context: ./backend # ./backend/Dockerfile を使ってビルド
    ports:
      - "8000:8000" # PCの8000番ポートをコンテナの8000番に接続
    volumes:
      - ./backend/app:/app # PCのソースコードをコンテナに同期（コード変更が即反映）
    depends_on:
      - db # dbサービスが起動してから起動する
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mamoru_navi_db

  # 2. フロントエンドサービス
  frontend:
    build:
      context: ./frontend # ./frontend/Dockerfile を使ってビルド
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - /app/node_modules # node_modulesはコンテナ内のものを使う（重要）
      - ./frontend:/app # PCのソースコードをコンテナに同期
    stdin_open: true # コンテナ内でコマンドを実行し続けるために必要
    tty: true

  # 3. データベースサービス (OSMインポート機能内蔵版)
  db:
    # 以前作成した osm2pgrouting インストール済みのDockerfileを使用
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: mamoru-navi-db-1 # 名前を固定しておくと便利です
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      # 平常時のSQL初期化
      - ./backend/sql:/docker-entrypoint-initdb.d
      # ★これが重要：OSMインポートスクリプト
      - ./db/init-osm.sh:/docker-entrypoint-initdb.d/init-osm.sh
      # 巨大な生データ
      - ./kinki-latest.osm.pbf:/tmp/kinki-latest.osm.pbf
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mamoru_navi_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mamoru_navi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ★ restart設定：不慮の停止時に自動復旧させる
    restart: always

volumes:
  postgres_data:
